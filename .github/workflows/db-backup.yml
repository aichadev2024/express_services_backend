name: Database backup to Cloudflare R2

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  # Must be >= the major version of the production PostgreSQL server.
  PG_CLIENT_VERSION: "17"
  RETENTION_DAYS: "30"
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_CLIENT_VERSION}"
          "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/pg_dump" --version

      - name: Dump database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          FILE="express_services_$(date -u +%Y-%m-%d_%H%M%S).dump"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/pg_dump" \
            --format=custom --no-owner --no-privileges \
            --dbname="$BACKUP_DATABASE_URL" --file="$FILE"

      - name: Verify dump
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "$FILE")
          echo "Dump size: $SIZE bytes"
          [ "$SIZE" -gt 1024 ] || { echo "Dump suspiciously small"; exit 1; }
          "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/pg_restore" --list "$FILE" > /dev/null

      - name: Upload to R2
        run: |
          set -euo pipefail
          aws s3 cp "$FILE" "s3://${R2_BUCKET}/db/${FILE}" --endpoint-url "$R2_ENDPOINT"

      - name: Prune backups older than retention
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          OLD=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix db/ \
            --endpoint-url "$R2_ENDPOINT" \
            --query "Contents[?LastModified<='${CUTOFF}'].Key" --output text)
          for KEY in $OLD; do
            [ "$KEY" = "None" ] && continue
            echo "Deleting $KEY"
            aws s3 rm "s3://${R2_BUCKET}/${KEY}" --endpoint-url "$R2_ENDPOINT"
          done
